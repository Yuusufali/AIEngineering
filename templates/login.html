{% extends "base.html" %}
{% block title %}Вход — Mini AI{% endblock %}
{% block content %}
<h1>Mini AI</h1>
<div class="card">
  <form method="post" action="{{ url_for('login') }}">
    <div class="form-group">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" required autofocus placeholder="Введите логин">
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required placeholder="Введите пароль">
    </div>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  <p class="links" style="margin-top: 1rem;">
    Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
  </p>
</div>
{% endblock %}
