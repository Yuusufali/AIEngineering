{% extends "base.html" %}
{% block title %}Регистрация — Mini AI{% endblock %}
{% block content %}
<h1>Mini AI</h1>
<div class="card">
  <form method="post" action="{{ url_for('register') }}">
    <div class="form-group">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" required autofocus placeholder="Придумайте логин">
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required placeholder="Минимум 4 символа">
    </div>
    <div class="form-group">
      <label for="password2">Повторите пароль</label>
      <input type="password" id="password2" name="password2" required placeholder="Повторите пароль">
    </div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
  <p class="links" style="margin-top: 1rem;">
    Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
  </p>
</div>
{% endblock %}
