<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mini AI{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #1a1b26 0%, #24283b 100%);
      color: #c0caf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #7aa2f7;
    }
    .card {
      background: rgba(36, 40, 59, 0.9);
      border: 1px solid #3b4261;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      color: #a9b1d6;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #3b4261;
      border-radius: 8px;
      background: #1a1b26;
      color: #c0caf5;
    }
    input:focus {
      outline: none;
      border-color: #7aa2f7;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #7aa2f7;
      color: #1a1b26;
      margin-top: 0.5rem;
    }
    .btn-primary:hover { background: #89b4fa; }
    .btn-ghost {
      background: transparent;
      color: #7aa2f7;
      border: 1px solid #3b4261;
    }
    .btn-ghost:hover { background: rgba(122, 162, 247, 0.15); }
    .links { text-align: center; margin-top: 1rem; }
    .links a { color: #7aa2f7; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .alert {
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-success { background: rgba(159, 234, 159, 0.2); color: #9ece6a; border: 1px solid #9ece6a; }
    .alert-error { background: rgba(247, 118, 142, 0.2); color: #f7768e; border: 1px solid #f7768e; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .header h1 { margin: 0; }
    form.inline { display: inline; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
